name: Publish WordPress CapRover images

on:
  push:
    branches: ["main", "master"]
    tags: ["v*", "release-*", "*.*.*"]
  workflow_dispatch:

concurrency:
  group: ghcr-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wordpress-caprover-apache
            file: Dockerfile
            cache_scope: apache
            description: Apache + mod_php with memcached and redis cache backends
          - image: wordpress-caprover-fpm
            file: Dockerfile.fpm
            cache_scope: fpm
            description: PHP-FPM with yac, igbinary, and imagick
          - image: wordpress-caprover-apache-yac
            file: Dockerfile.apache
            cache_scope: apache-yac
            description: Apache with YAC and tuned OPcache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=${{ matrix.cache_scope }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.cache_scope }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true
