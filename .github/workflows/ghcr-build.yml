name: Build and Push Docker Image

on:
  push:
    branches: ["main", "master"]
    tags: ["v*", "release-*", "*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (apache)
        id: meta-apache
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wordpress-caprover-apache
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (apache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          push: true
          tags: ${{ steps.meta-apache.outputs.tags }}
          labels: ${{ steps.meta-apache.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=apache
          cache-to: type=gha,mode=max,scope=apache

      - name: Extract Docker metadata (fpm)
        id: meta-fpm
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wordpress-caprover-fpm
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (fpm)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fpm
          pull: true
          push: true
          tags: ${{ steps.meta-fpm.outputs.tags }}
          labels: ${{ steps.meta-fpm.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=fpm
          cache-to: type=gha,mode=max,scope=fpm

      - name: Extract Docker metadata (apache-tuned)
        id: meta-apache-tuned
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wordpress-caprover-7.0.4
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (apache-tuned)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.apache
          pull: true
          push: true
          tags: ${{ steps.meta-apache-tuned.outputs.tags }}
          labels: ${{ steps.meta-apache-tuned.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=7.0.4
          cache-to: type=gha,mode=max,scope=7.0.4
